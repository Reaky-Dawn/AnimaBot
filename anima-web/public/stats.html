<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Anima · 流量统计</title>
  <link rel="stylesheet" href="styles/design-tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); margin-bottom: var(--space-xl); }
    .stat-card { text-align: center; padding: var(--space-lg) var(--space-md); }
    .stat-card__value { font-size: 2rem; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); }
    .stat-card__label { font-size: var(--font-size-caption); color: var(--text-tertiary); margin-top: 4px; }
    .chart-card { padding: var(--space-lg); }
    .chart-card h2 { font-size: var(--font-size-title-md); margin-bottom: var(--space-md); }
    .legend { display: flex; gap: var(--space-lg); margin-bottom: var(--space-sm); font-size: var(--font-size-caption); color: var(--text-secondary); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
    .legend .lg-pv i { background: #5b7cff; }
    .legend .lg-uv i { background: #8a6cf0; }
    .legend .lg-tasks i { background: #59c2e8; }
    #chart-wrap { width: 100%; overflow-x: auto; }
    #chart svg { display: block; width: 100%; height: auto; }
    .chart-tip { font-size: var(--font-size-caption); color: var(--text-tertiary); margin-top: var(--space-sm); }
    #stats-error { color: var(--text-secondary); text-align: center; padding: var(--space-xl); }
    .range-tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); }
    .range-tabs button { padding: 4px 14px; font-size: var(--font-size-caption); border-radius: var(--radius-full); border: 1px solid var(--border-divider); background: transparent; color: var(--text-secondary); cursor: pointer; }
    .range-tabs button[aria-pressed="true"] { background: var(--color-btn-disabled-bg); color: var(--text-primary); border-color: transparent; }
    @media (max-width: 767px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="page-stats">

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html" aria-label="Anima 首页">
        <span class="brand__icon" aria-hidden="true">✦</span>
        <span class="brand__text">Anima</span>
      </a>
      <span class="topbar__task">流量统计</span>
    </div>
  </header>

  <main class="site-main">
    <div class="stats-grid">
      <div class="card stat-card"><div class="stat-card__value" id="kpi-pv">–</div><div class="stat-card__label">总浏览量（PV）</div></div>
      <div class="card stat-card"><div class="stat-card__value" id="kpi-uv">–</div><div class="stat-card__label">独立访客（UV，区间去重）</div></div>
      <div class="card stat-card"><div class="stat-card__value" id="kpi-tasks">–</div><div class="stat-card__label">生成任务数</div></div>
    </div>

    <div class="card chart-card">
      <h2>浏览量随时间变化</h2>
      <div class="range-tabs" role="group" aria-label="时间范围">
        <button type="button" data-days="7" aria-pressed="false">近 7 天</button>
        <button type="button" data-days="30" aria-pressed="true">近 30 天</button>
        <button type="button" data-days="90" aria-pressed="false">近 90 天</button>
      </div>
      <div class="legend">
        <span class="lg-pv"><i></i>浏览量 PV</span>
        <span class="lg-uv"><i></i>独立访客 UV</span>
        <span class="lg-tasks"><i></i>任务数</span>
      </div>
      <div id="chart-wrap"><div id="chart" role="img" aria-label="每日浏览量、独立访客与任务数折线图"></div></div>
      <p class="chart-tip">统计口径：PV=页面打开次数；UV=按浏览器本地随机令牌去重（不含 IP/UA 等个人信息）；任务数=当日提交的生图任务。</p>
    </div>
    <p id="stats-error" hidden></p>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__item">仅供内部使用</p>
      <p class="footer__item">站内图片均为「AI 生成」</p>
    </div>
  </footer>

  <script>
  (function () {
    'use strict';
    var state = { days: 30 };

    function fmt(n) { return (typeof n === 'number' ? n : 0).toLocaleString('zh-CN'); }

    function renderChart(items) {
      // items: 时间倒序（[0]=今日）→ 转正序画折线
      var data = items.slice().reverse();
      var W = 900, H = 300, PAD_L = 44, PAD_R = 12, PAD_T = 14, PAD_B = 34;
      var n = data.length;
      var maxV = 1;
      for (var i = 0; i < n; i++) {
        maxV = Math.max(maxV, data[i].pv, data[i].uv, data[i].tasks);
      }
      // y 轴刻度取整到好看的数
      var step = Math.pow(10, Math.floor(Math.log10(maxV)));
      maxV = Math.ceil(maxV / step) * step;
      if (maxV <= 1) maxV = 4;

      function x(i) { return PAD_L + (n <= 1 ? 0 : (W - PAD_L - PAD_R) * i / (n - 1)); }
      function y(v) { return PAD_T + (H - PAD_T - PAD_B) * (1 - v / maxV); }

      var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">';
      // 网格 + y 轴标签
      for (var g = 0; g <= 4; g++) {
        var gy = y(maxV * g / 4);
        s += '<line x1="' + PAD_L + '" y1="' + gy + '" x2="' + (W - PAD_R) + '" y2="' + gy + '" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
        s += '<text x="' + (PAD_L - 6) + '" y="' + (gy + 4) + '" fill="#6b739b" font-size="10" text-anchor="end">' + Math.round(maxV * g / 4) + '</text>';
      }
      // x 轴日期（按点数抽稀：最多 10 个标签）
      var labelEvery = Math.max(1, Math.ceil(n / 10));
      for (var i = 0; i < n; i++) {
        if (i % labelEvery === 0 || i === n - 1) {
          s += '<text x="' + x(i) + '" y="' + (H - 12) + '" fill="#6b739b" font-size="10" text-anchor="middle">' + data[i].date.slice(5) + '</text>';
        }
      }
      // 三条折线
      function path(key, color) {
        var d = '';
        for (var i = 0; i < n; i++) d += (i ? ' L' : 'M') + x(i).toFixed(1) + ',' + y(data[i][key]).toFixed(1);
        return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      }
      s += path('pv', '#5b7cff');
      s += path('uv', '#8a6cf0');
      s += path('tasks', '#59c2e8');
      // 数据点 + 标题悬浮
      for (var i = 0; i < n; i++) {
        var d = data[i];
        s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.pv).toFixed(1) + '" r="2.5" fill="#5b7cff"><title>' + d.date + ' | PV ' + d.pv + ' | UV ' + d.uv + ' | 任务 ' + d.tasks + '</title></circle>';
        s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.uv).toFixed(1) + '" r="2" fill="#8a6cf0"><title>' + d.date + ' | PV ' + d.pv + ' | UV ' + d.uv + ' | 任务 ' + d.tasks + '</title></circle>';
        s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d.tasks).toFixed(1) + '" r="2" fill="#59c2e8"><title>' + d.date + ' | PV ' + d.pv + ' | UV ' + d.uv + ' | 任务 ' + d.tasks + '</title></circle>';
      }
      s += '</svg>';
      document.getElementById('chart').innerHTML = s;
    }

    function load() {
      var errEl = document.getElementById('stats-error');
      fetch('/api/stats/summary?days=' + state.days)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          errEl.hidden = true;
          document.getElementById('kpi-pv').textContent = fmt(d.totals.pv);
          document.getElementById('kpi-uv').textContent = fmt(d.totals.uv);
          document.getElementById('kpi-tasks').textContent = fmt(d.totals.tasks);
          renderChart(d.items);
        })
        .catch(function (e) {
          errEl.hidden = false;
          errEl.textContent = '统计加载失败（' + e.message + '），请稍后刷新重试';
        });
    }

    document.querySelector('.range-tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-days]');
      if (!btn) return;
      state.days = parseInt(btn.getAttribute('data-days'), 10);
      document.querySelectorAll('.range-tabs button').forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      load();
    });

    load();
    // 每 5 分钟自动刷新（看板常开场景）
    setInterval(load, 5 * 60 * 1000);
  })();
  </script>
</body>
</html>
