name: Auto-restart Kaggle engine

# 自动重启引擎：当「引擎心跳超时（会话被关闭）」且「有排队任务」时才触发。
# 注意：run 块内所有行必须保持缩进（YAML 块标量），python 一律单行，否则解析失败。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测引擎心跳与排队任务
        id: status
        env:
          WORKER_BASE_URL: https://animadraw.cloud
          ENGINE_ID: engine-1
          ENGINE_KEY: ${{ secrets.ENGINE_KEY }}
        run: |
          set +e
          # 带鉴权头 + 浏览器式 UA（Cloudflare 会拦 Python-urllib 等明显机器人 UA）
          RESP=$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${ENGINE_KEY}" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AnimaBot-Status/1.0" \
            "${WORKER_BASE_URL}/api/engine/status?engine_id=${ENGINE_ID}" 2>/dev/null || \
            echo '{"engine_alive":false,"queued_count":0}')
          ALIVE=$(echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(bool(d.get("engine_alive", False)))' 2>/dev/null || echo False)
          QUEUED=$(echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(int(d.get("queued_count", 0)))' 2>/dev/null || echo 0)
          echo "alive=$ALIVE" >> "$GITHUB_OUTPUT"
          echo "queued=$QUEUED" >> "$GITHUB_OUTPUT"
          echo "status raw: $RESP"

      - name: 条件判断（引擎死 + 有任务 → 重启）
        id: decide
        run: |
          if [ "${{ steps.status.outputs.alive }}" = "False" ] && [ "${{ steps.status.outputs.queued }}" -gt 0 ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
            echo "条件满足：alive=false, queued=${{ steps.status.outputs.queued }}，执行重启"
          else
            echo "restart=false" >> "$GITHUB_OUTPUT"
            echo "无需重启：alive=${{ steps.status.outputs.alive }}, queued=${{ steps.status.outputs.queued }}"
          fi

      - name: 安装 kaggle CLI
        if: steps.decide.outputs.restart == 'true'
        run: python3 -m pip install --quiet kaggle

      - name: 推送 notebook 重启引擎（账号池轮换，Sprint 17）
        if: steps.decide.outputs.restart == 'true'
        env:
          KAGGLE_ACCOUNTS: ${{ secrets.KAGGLE_ACCOUNTS }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # 账号池：逐个尝试 push，成功即停；全失败退出非零（下轮 cron 再试）。
          # KAGGLE_ACCOUNTS = [{"user":"reagino","token":"KGAT_.."},{"user":"reagino2","token":"KGAT_.."}]
          # 未配置时回退单账号 KAGGLE_API_TOKEN（兼容旧部署）。新账号只需在 secret 里追加元素。
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          raw = os.environ.get("KAGGLE_ACCOUNTS", "").strip()
          accounts = []
          if raw:
              try:
                  arr = json.loads(raw)
                  accounts = [{"user": a.get("user", ""), "token": a.get("token", "")}
                              for a in arr if isinstance(a, dict) and a.get("token")]
              except Exception as e:
                  print("KAGGLE_ACCOUNTS 解析失败，回退单账号:", e)
          if not accounts and os.environ.get("KAGGLE_API_TOKEN"):
              accounts = [{"user": "", "token": os.environ["KAGGLE_API_TOKEN"]}]

          if not accounts:
              print("未配置任何 Kaggle 账号"); sys.exit(1)

          for i, acct in enumerate(accounts):
              label = acct["user"] or ("account%d" % (i + 1))
              print("== 尝试账号 %s ==" % label)
              env = dict(os.environ, KAGGLE_API_TOKEN=acct["token"])
              r = subprocess.run(["kaggle", "kernels", "push", "-p", "kaggle-notebook/"],
                                 env=env, capture_output=True, text=True)
              print((r.stdout or "").strip()[-300:])
              if r.returncode == 0 and "successfully pushed" in (r.stdout or ""):
                  print("账号 %s push 成功" % label); sys.exit(0)
              print("账号 %s push 失败 rc=%s %s" % (label, r.returncode, (r.stderr or "")[-200:]))
          print("所有账号均失败"); sys.exit(1)
          PYEOF
